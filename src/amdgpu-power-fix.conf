# /etc/amdgpu-power-fix.conf — settings for the amdgpu-power-fix shutdown hook.
# 1 = on, 0 = off. The defaults below are the combination that fixed the hang.

# Drop the GPU to its lowest DPM clocks before power-off.
QUIESCE_ON_POWEROFF=1
# Unbind the GPU (and its HDMI/DP audio) from the driver before power-off.
UNBIND_ON_POWEROFF=1
# After unbinding, bus-reset the GPU (what a reboot does). Needs UNBIND_ON_POWEROFF=1.
RESET_ON_POWEROFF=1
# Pause 2s after each hook message so it can be read on screen (diagnostics only).
VERBOSE=0
